# PostgreSQL Production Configuration Template for AuraMart
listen_addresses = '*'
max_connections = 200

# Memory Tuning
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 10MB

# Write-Ahead Log (WAL)
min_wal_size = 1GB
max_wal_size = 4GB
wal_level = replica
max_wal_senders = 10

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Log queries taking over 250ms

# Autovacuum
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
