# Redis Production Configuration Template for AuraMart
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 512mb
maxmemory-policy volatile-lru

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Snapshotting
save 900 1
save 300 10
save 60 10000

# Security (Require Password in Production via Env)
# requirepass YOUR_REDIS_PASSWORD_HERE
