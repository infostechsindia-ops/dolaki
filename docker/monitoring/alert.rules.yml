# AuraMart Prometheus — Production Alert Rules
# DEPLOY-001 Phase 5
groups:
  # ──────────────────────────────────────────────────────────────────────────
  - name: auramart.platform
    interval: 30s
    rules:
      # Backend health
      - alert: BackendDown
        expr: up{job="auramart-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "AuraMart Backend is DOWN"
          description: "The backend API has been unreachable for over 1 minute."

      - alert: HighAPIErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) /
          rate(http_requests_total[5m]) > 0.01
        for: 3m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High API error rate (>1%)"
          description: "5xx error rate is {{ humanizePercentage $value }} over the last 5 minutes."

      - alert: SlowAPILatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API P95 latency > 500ms"
          description: "P95 latency is {{ humanizeDuration $value }}."

  # ──────────────────────────────────────────────────────────────────────────
  - name: auramart.database
    rules:
      - alert: PostgresDown
        expr: up{job="postgres-exporter"} == 0
        for: 30s
        labels:
          severity: critical
          team: database
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL exporter is unreachable — database may be down."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 160
        for: 5m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "PostgreSQL connections high (>160/200)"
          description: "Current connections: {{ $value }}. Max is 200."

      - alert: PostgresSlowQueries
        expr: pg_stat_activity_max_tx_duration{state="active"} > 30
        for: 2m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "Long-running PostgreSQL query detected"
          description: "Query running for {{ humanizeDuration $value }}."

      - alert: PostgresDiskSpaceHigh
        expr: |
          (pg_database_size_bytes / (1024*1024*1024)) > 50
        for: 5m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "PostgreSQL database size > 50GB"
          description: "Database size is {{ humanize $value }}GB."

      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 30s
        labels:
          severity: critical
          team: database
        annotations:
          summary: "Redis is DOWN"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "Redis memory usage > 85%"
          description: "Memory usage: {{ humanizePercentage $value }}."

  # ──────────────────────────────────────────────────────────────────────────
  - name: auramart.infrastructure
    rules:
      - alert: HostCpuHigh
        expr: |
          100 - (avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[2m])
          ) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Host CPU usage > 80%"
          description: "CPU usage is {{ humanizePercentage $value }}."

      - alert: HostMemoryHigh
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.90
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Host memory usage > 90%"
          description: "Memory usage: {{ humanizePercentage $value }}."

      - alert: HostDiskHigh
        expr: |
          (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"})
          / node_filesystem_size_bytes{fstype!="tmpfs"} > 0.80
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Disk usage > 80%"
          description: "Disk {{ $labels.mountpoint }}: {{ humanizePercentage $value }}."

      - alert: HostDiskCritical
        expr: |
          (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"})
          / node_filesystem_size_bytes{fstype!="tmpfs"} > 0.95
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "CRITICAL: Disk usage > 95%"

      - alert: NginxDown
        expr: up{job="nginx-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Nginx is DOWN"

      - alert: ContainerDown
        expr: |
          absent(container_last_seen{name=~"auramart-backend-prod|auramart-web-prod|auramart-admin-prod"})
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "AuraMart container is down"
          description: "Container {{ $labels.name }} has been absent for > 2 minutes."

  # ──────────────────────────────────────────────────────────────────────────
  - name: auramart.business
    rules:
      - alert: HighOrderErrorRate
        expr: |
          rate(auramart_order_errors_total[5m]) > 0.5
        for: 3m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High order processing error rate"

      - alert: PaymentGatewayErrors
        expr: |
          rate(auramart_payment_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Payment gateway error rate elevated"
